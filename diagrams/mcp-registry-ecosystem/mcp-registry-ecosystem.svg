<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The MCP Registry ecosystem: one registry defines a specification that public marketplaces and private enterprise registries implement, and MCP clients read from either.">
  <title>The MCP Registry ecosystem</title>
  <desc>Source: mcp-registry-ecosystem.md (mermaid, flowchart TD). Redraw changes layout, colour, node styling and connector routing only. Nodes: 5 in source, 5 drawn. Edges: 4 in source, 4 drawn. Node titles and captions preserved verbatim. Added: none. Dropped: none. Badges render the source's own class assignments (registry, client); they are not a second reading of the graph. Cards are neutral because badges carry the category — the two encodings are alternatives, never partners. Focal accent on MCP Registry: it is the node the other four depend on, and the only one that defines rather than implements. No motion: this is a structural map, and animating it would imply traffic the diagram does not describe.</desc>
  <defs>
    <pattern id="dgR" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.5" fill="#6d5fc4" opacity="0.10"/></pattern>
    <marker id="arR" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/></marker>
  </defs>

  <rect width="900" height="620" fill="#eef0fb"/>
  <rect width="900" height="620" fill="url(#dgR)"/>

  <!-- connectors -->
  <path d="M450,136 L450,183 Q450,193 440,193 L245,193 Q235,193 235,203 L235,250" fill="none" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arR)"/>
  <path d="M450,136 L450,183 Q450,193 460,193 L655,193 Q665,193 665,203 L665,250" fill="none" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arR)"/>
  <path d="M235,326 L235,440" fill="none" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arR)"/>
  <path d="M665,326 L665,440" fill="none" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arR)"/>

  <!-- MCP Registry (focal) -->
  <rect x="310" y="60" width="280" height="76" rx="10" fill="#ffffff" stroke="#1e2333" stroke-width="1.8"/>
  <rect x="324" y="69" width="56" height="16" rx="4" fill="#4f46e5" opacity="0.16"/>
  <text x="352" y="80.5" text-anchor="middle" font-family="Geist Mono, ui-monospace, Menlo, monospace" font-size="8" font-weight="600" letter-spacing="0.04em" fill="#4f46e5">REGISTRY</text>
  <text x="450" y="107" text-anchor="middle" font-family="Geist, -apple-system, sans-serif" font-size="13.5" font-weight="600" fill="#1e2333">MCP Registry</text>
  <text x="450" y="125" text-anchor="middle" font-family="Geist Mono, ui-monospace, Menlo, monospace" font-size="9.5" fill="#6b7280">source of truth for server metadata</text>

  <!-- Public aggregators -->
  <rect x="95" y="250" width="280" height="76" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="109" y="259" width="56" height="16" rx="4" fill="#4f46e5" opacity="0.16"/>
  <text x="137" y="270.5" text-anchor="middle" font-family="Geist Mono, ui-monospace, Menlo, monospace" font-size="8" font-weight="600" letter-spacing="0.04em" fill="#4f46e5">REGISTRY</text>
  <text x="235" y="297" text-anchor="middle" font-family="Geist, -apple-system, sans-serif" font-size="13.5" font-weight="600" fill="#1e2333">Public aggregators / marketplaces</text>
  <text x="235" y="315" text-anchor="middle" font-family="Geist Mono, ui-monospace, Menlo, monospace" font-size="9.5" fill="#6b7280">curation, ratings, extra metadata</text>

  <!-- Private registries -->
  <rect x="525" y="250" width="280" height="76" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="539" y="259" width="56" height="16" rx="4" fill="#4f46e5" opacity="0.16"/>
  <text x="567" y="270.5" text-anchor="middle" font-family="Geist Mono, ui-monospace, Menlo, monospace" font-size="8" font-weight="600" letter-spacing="0.04em" fill="#4f46e5">REGISTRY</text>
  <text x="665" y="297" text-anchor="middle" font-family="Geist, -apple-system, sans-serif" font-size="13.5" font-weight="600" fill="#1e2333">Private / enterprise registries</text>
  <text x="665" y="315" text-anchor="middle" font-family="Geist Mono, ui-monospace, Menlo, monospace" font-size="9.5" fill="#6b7280">org-specific discovery and policy</text>

  <!-- MCP clients (public branch) -->
  <rect x="95" y="440" width="280" height="76" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="109" y="449" width="46" height="16" rx="4" fill="#2f6fa8" opacity="0.16"/>
  <text x="132" y="460.5" text-anchor="middle" font-family="Geist Mono, ui-monospace, Menlo, monospace" font-size="8" font-weight="600" letter-spacing="0.04em" fill="#2f6fa8">CLIENT</text>
  <text x="235" y="487" text-anchor="middle" font-family="Geist, -apple-system, sans-serif" font-size="13.5" font-weight="600" fill="#1e2333">MCP clients</text>
  <text x="235" y="505" text-anchor="middle" font-family="Geist Mono, ui-monospace, Menlo, monospace" font-size="9.5" fill="#6b7280">read server metadata</text>

  <!-- MCP clients (private branch) -->
  <rect x="525" y="440" width="280" height="76" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="539" y="449" width="46" height="16" rx="4" fill="#2f6fa8" opacity="0.16"/>
  <text x="562" y="460.5" text-anchor="middle" font-family="Geist Mono, ui-monospace, Menlo, monospace" font-size="8" font-weight="600" letter-spacing="0.04em" fill="#2f6fa8">CLIENT</text>
  <text x="665" y="487" text-anchor="middle" font-family="Geist, -apple-system, sans-serif" font-size="13.5" font-weight="600" fill="#1e2333">MCP clients</text>
  <text x="665" y="505" text-anchor="middle" font-family="Geist Mono, ui-monospace, Menlo, monospace" font-size="9.5" fill="#6b7280">read server metadata</text>

  <!-- legend -->
  <line x1="95" y1="560" x2="805" y2="560" stroke="#c9cede" stroke-width="1"/>
  <rect x="95" y="575" width="56" height="16" rx="4" fill="#4f46e5" opacity="0.16"/>
  <text x="123" y="586.5" text-anchor="middle" font-family="Geist Mono, ui-monospace, Menlo, monospace" font-size="8" font-weight="600" letter-spacing="0.04em" fill="#4f46e5">REGISTRY</text>
  <text x="161" y="588" font-family="Geist Mono, ui-monospace, Menlo, monospace" font-size="9" fill="#1e2333">serves metadata</text>
  <rect x="300" y="575" width="46" height="16" rx="4" fill="#2f6fa8" opacity="0.16"/>
  <text x="323" y="586.5" text-anchor="middle" font-family="Geist Mono, ui-monospace, Menlo, monospace" font-size="8" font-weight="600" letter-spacing="0.04em" fill="#2f6fa8">CLIENT</text>
  <text x="356" y="588" font-family="Geist Mono, ui-monospace, Menlo, monospace" font-size="9" fill="#1e2333">consumes it</text>
  <text x="805" y="588" text-anchor="end" font-family="Geist Mono, ui-monospace, Menlo, monospace" font-size="9" fill="#8b93a1">5 nodes · 4 edges · unchanged from source</text>
</svg>
