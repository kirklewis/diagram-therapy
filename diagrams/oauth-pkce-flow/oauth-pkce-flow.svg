<svg viewBox="0 0 1060 880" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="OAuth 2.0 authorization code flow with PKCE, as a sequence between user agent, client app, authorization server and resource server.">
  <title>OAuth 2.0 authorization code flow with PKCE</title>
  <desc>Source: oauth-pkce-flow.md (mermaid, sequenceDiagram). Redraw changes layout, colour, lifeline styling and label placement only. Participants: 4 in source, 4 drawn. Messages: 8 in source, 8 drawn. Notes: 3 in source, 3 drawn. Message labels and note text preserved verbatim. Added: none. Dropped: none. Participants carry no captions because in a sequence diagram the claims sit on the messages, not on the actors; a caption on Authorization Server would restate what its arrows already say. Focal accent on the PKCE verification note: it is the step the whole extension exists to add. Motion replays the exchange in protocol order; every message is legible without it.</desc>
  <defs>
    <pattern id="dgO" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.5" fill="#6d5fc4" opacity="0.10"/></pattern>
    <marker id="reqA" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/></marker>
    <marker id="resA" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/></marker>
  </defs>

  <rect width="1060" height="880" fill="#eef0fb"/>
  <rect width="1060" height="880" fill="url(#dgO)"/>

  <!-- lifelines -->
  <line x1="145" y1="80" x2="145" y2="770" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,5"/>
  <line x1="400" y1="80" x2="400" y2="770" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,5"/>
  <line x1="655" y1="80" x2="655" y2="770" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,5"/>
  <line x1="910" y1="80" x2="910" y2="770" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,5"/>

  <!-- participants -->
  <rect x="50" y="30" width="190" height="50" rx="10" fill="#ffffff" stroke="#2f6fa8" stroke-width="1.5"/>
  <text x="145" y="60" text-anchor="middle" font-family="Geist, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1e2333">User Agent</text>

  <rect x="305" y="30" width="190" height="50" rx="10" fill="#ffffff" stroke="#2f6fa8" stroke-width="1.5"/>
  <text x="400" y="60" text-anchor="middle" font-family="Geist, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1e2333">Client App</text>

  <rect x="560" y="30" width="190" height="50" rx="10" fill="#ffffff" stroke="#2f6fa8" stroke-width="1.5"/>
  <text x="655" y="60" text-anchor="middle" font-family="Geist, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1e2333">Authorization Server</text>

  <rect x="815" y="30" width="190" height="50" rx="10" fill="#ffffff" stroke="#2f6fa8" stroke-width="1.5"/>
  <text x="910" y="60" text-anchor="middle" font-family="Geist, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1e2333">Resource Server</text>

  <!-- messages -->
  <path d="M400,205 L152,205" fill="none" stroke="#6b7280" stroke-width="1.4" marker-end="url(#reqA)"/>
  <text x="272" y="182" text-anchor="middle" font-family="Geist Mono, ui-monospace, Menlo, monospace" font-size="9.5" fill="#1e2333">Redirect to /authorize</text>
  <text x="272" y="196" text-anchor="middle" font-family="Geist Mono, ui-monospace, Menlo, monospace" font-size="9.5" fill="#6b7280">client_id · state · code_challenge</text>

  <path d="M145,255 L648,255" fill="none" stroke="#6b7280" stroke-width="1.4" marker-end="url(#reqA)"/>
  <text x="400" y="246" text-anchor="middle" font-family="Geist Mono, ui-monospace, Menlo, monospace" font-size="9.5" fill="#1e2333">GET /authorize</text>

  <path d="M655,390 L152,390" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#resA)"/>
  <text x="400" y="367" text-anchor="middle" font-family="Geist Mono, ui-monospace, Menlo, monospace" font-size="9.5" fill="#1e2333">302 to redirect_uri</text>
  <text x="400" y="381" text-anchor="middle" font-family="Geist Mono, ui-monospace, Menlo, monospace" font-size="9.5" fill="#6b7280">code · state</text>

  <path d="M145,435 L393,435" fill="none" stroke="#6b7280" stroke-width="1.4" marker-end="url(#reqA)"/>
  <text x="272" y="426" text-anchor="middle" font-family="Geist Mono, ui-monospace, Menlo, monospace" font-size="9.5" fill="#1e2333">Deliver authorization code</text>

  <path d="M400,490 L648,490" fill="none" stroke="#6b7280" stroke-width="1.4" marker-end="url(#reqA)"/>
  <text x="527" y="467" text-anchor="middle" font-family="Geist Mono, ui-monospace, Menlo, monospace" font-size="9.5" fill="#1e2333">POST /token</text>
  <text x="527" y="481" text-anchor="middle" font-family="Geist Mono, ui-monospace, Menlo, monospace" font-size="9.5" fill="#6b7280">code · code_verifier · client_id</text>

  <path d="M655,625 L407,625" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#resA)"/>
  <text x="527" y="602" text-anchor="middle" font-family="Geist Mono, ui-monospace, Menlo, monospace" font-size="9.5" fill="#1e2333">access_token · expires_in</text>
  <text x="527" y="616" text-anchor="middle" font-family="Geist Mono, ui-monospace, Menlo, monospace" font-size="9.5" fill="#6b7280">refresh_token</text>

  <path d="M400,680 L903,680" fill="none" stroke="#6b7280" stroke-width="1.4" marker-end="url(#reqA)"/>
  <text x="655" y="657" text-anchor="middle" font-family="Geist Mono, ui-monospace, Menlo, monospace" font-size="9.5" fill="#1e2333">GET /resource</text>
  <text x="655" y="671" text-anchor="middle" font-family="Geist Mono, ui-monospace, Menlo, monospace" font-size="9.5" fill="#6b7280">Authorization: Bearer</text>

  <path d="M910,725 L407,725" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#resA)"/>
  <text x="655" y="716" text-anchor="middle" font-family="Geist Mono, ui-monospace, Menlo, monospace" font-size="9.5" fill="#1e2333">Protected resource</text>

  <!-- notes -->
  <rect x="285" y="100" width="230" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="400" y="123" text-anchor="middle" font-family="Geist Mono, ui-monospace, Menlo, monospace" font-size="9.5" fill="#1e2333">Generate code_verifier</text>
  <text x="400" y="137" text-anchor="middle" font-family="Geist Mono, ui-monospace, Menlo, monospace" font-size="9.5" fill="#6b7280">code_challenge = S256(verifier)</text>

  <rect x="540" y="285" width="230" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="655" y="308" text-anchor="middle" font-family="Geist Mono, ui-monospace, Menlo, monospace" font-size="9.5" fill="#1e2333">Authenticate the user</text>
  <text x="655" y="322" text-anchor="middle" font-family="Geist Mono, ui-monospace, Menlo, monospace" font-size="9.5" fill="#6b7280">and record consent</text>

  <rect x="540" y="520" width="230" height="50" rx="8" fill="#fbf1e6" stroke="#d9822b" stroke-width="1.5"/>
  <text x="655" y="543" text-anchor="middle" font-family="Geist Mono, ui-monospace, Menlo, monospace" font-size="9.5" fill="#1e2333">S256(code_verifier) must equal</text>
  <text x="655" y="557" text-anchor="middle" font-family="Geist Mono, ui-monospace, Menlo, monospace" font-size="9.5" fill="#d9822b">the stored code_challenge</text>

  <!-- Packets: one relay pass down the exchange, in protocol order.
       Each fades in, then shrinks and fades out in the last few pixels before the head, so it is
       gone before it reaches the arrowhead rather than sitting on top of it. -->
  <circle r="5" fill="#6b7280" opacity="0">
    <animateMotion id="p1" dur="0.9s" begin="0.4s;p8.end+1.2s" path="M400,205 L152,205"/>
    <animate attributeName="opacity" begin="p1.begin" dur="0.9s" values="0;1;1;0;0" keyTimes="0;0.06;0.92;0.99;1"/>
    <animate attributeName="r" begin="p1.begin" dur="0.9s" values="5;5;0;0" keyTimes="0;0.92;0.99;1"/>
  </circle>
  <circle r="5" fill="#6b7280" opacity="0">
    <animateMotion id="p2" dur="0.9s" begin="p1.end" path="M145,255 L648,255"/>
    <animate attributeName="opacity" begin="p2.begin" dur="0.9s" values="0;1;1;0;0" keyTimes="0;0.06;0.92;0.99;1"/>
    <animate attributeName="r" begin="p2.begin" dur="0.9s" values="5;5;0;0" keyTimes="0;0.92;0.99;1"/>
  </circle>
  <circle r="5" fill="#94a3b8" opacity="0">
    <animateMotion id="p3" dur="0.9s" begin="p2.end+0.5s" path="M655,390 L152,390"/>
    <animate attributeName="opacity" begin="p3.begin" dur="0.9s" values="0;1;1;0;0" keyTimes="0;0.06;0.92;0.99;1"/>
    <animate attributeName="r" begin="p3.begin" dur="0.9s" values="5;5;0;0" keyTimes="0;0.92;0.99;1"/>
  </circle>
  <circle r="5" fill="#6b7280" opacity="0">
    <animateMotion id="p4" dur="0.9s" begin="p3.end" path="M145,435 L393,435"/>
    <animate attributeName="opacity" begin="p4.begin" dur="0.9s" values="0;1;1;0;0" keyTimes="0;0.06;0.92;0.99;1"/>
    <animate attributeName="r" begin="p4.begin" dur="0.9s" values="5;5;0;0" keyTimes="0;0.92;0.99;1"/>
  </circle>
  <circle r="5" fill="#6b7280" opacity="0">
    <animateMotion id="p5" dur="0.9s" begin="p4.end" path="M400,490 L648,490"/>
    <animate attributeName="opacity" begin="p5.begin" dur="0.9s" values="0;1;1;0;0" keyTimes="0;0.06;0.92;0.99;1"/>
    <animate attributeName="r" begin="p5.begin" dur="0.9s" values="5;5;0;0" keyTimes="0;0.92;0.99;1"/>
  </circle>
  <circle r="5" fill="#94a3b8" opacity="0">
    <animateMotion id="p6" dur="0.9s" begin="p5.end+0.5s" path="M655,625 L407,625"/>
    <animate attributeName="opacity" begin="p6.begin" dur="0.9s" values="0;1;1;0;0" keyTimes="0;0.06;0.92;0.99;1"/>
    <animate attributeName="r" begin="p6.begin" dur="0.9s" values="5;5;0;0" keyTimes="0;0.92;0.99;1"/>
  </circle>
  <circle r="5" fill="#6b7280" opacity="0">
    <animateMotion id="p7" dur="0.9s" begin="p6.end" path="M400,680 L903,680"/>
    <animate attributeName="opacity" begin="p7.begin" dur="0.9s" values="0;1;1;0;0" keyTimes="0;0.06;0.92;0.99;1"/>
    <animate attributeName="r" begin="p7.begin" dur="0.9s" values="5;5;0;0" keyTimes="0;0.92;0.99;1"/>
  </circle>
  <circle r="5" fill="#94a3b8" opacity="0">
    <animateMotion id="p8" dur="0.9s" begin="p7.end" path="M910,725 L407,725"/>
    <animate attributeName="opacity" begin="p8.begin" dur="0.9s" values="0;1;1;0;0" keyTimes="0;0.06;0.92;0.99;1"/>
    <animate attributeName="r" begin="p8.begin" dur="0.9s" values="5;5;0;0" keyTimes="0;0.92;0.99;1"/>
  </circle>

  <!-- legend -->
  <line x1="50" y1="815" x2="1005" y2="815" stroke="#c9cede" stroke-width="1"/>
  <line x1="50" y1="838" x2="82" y2="838" stroke="#6b7280" stroke-width="1.4" marker-end="url(#reqA)"/>
  <text x="94" y="842" font-family="Geist Mono, ui-monospace, Menlo, monospace" font-size="9" fill="#1e2333">request</text>
  <line x1="180" y1="838" x2="212" y2="838" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#resA)"/>
  <text x="224" y="842" font-family="Geist Mono, ui-monospace, Menlo, monospace" font-size="9" fill="#1e2333">response</text>
  <rect x="320" y="830" width="30" height="16" rx="5" fill="#fbf1e6" stroke="#d9822b" stroke-width="1.3"/>
  <text x="360" y="842" font-family="Geist Mono, ui-monospace, Menlo, monospace" font-size="9" fill="#1e2333">the check PKCE exists to add</text>
  <text x="1005" y="842" text-anchor="end" font-family="Geist Mono, ui-monospace, Menlo, monospace" font-size="9" fill="#8b93a1">4 participants · 8 messages · 3 notes · unchanged from source</text>
</svg>
